<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10121a"/>
      <stop offset="0.55" stop-color="#161a24"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab4ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      .sans { font-family: "DejaVu Sans", "Noto Sans", sans-serif; }
      .mono { font-family: "DejaVu Sans Mono", "Noto Sans Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#3b5bdb" opacity="0.08"/>
  <circle cx="180" cy="620" r="260" fill="#5b8cff" opacity="0.06"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="38" fill="#0b0d12" opacity="0.9"/>
  <rect x="0" y="37" width="1200" height="1" fill="#2a2f3d"/>
  <g class="sans" fill="#5f6b80" font-size="13">
    <text x="28" y="25">1</text>
    <text x="60" y="25">2</text>
    <text x="92" y="25">3</text>
    <text x="124" y="25">4</text>
    <text x="158" y="25">5</text>
  </g>
  <rect x="46" y="16" width="8" height="8" rx="2" fill="#8ab4ff"/>
  <text x="420" y="25" class="sans" fill="#8b96aa" font-size="13">~ / projects</text>

  <!-- bar widget -->
  <g filter="url(#shadow)">
    <rect x="960" y="8" width="210" height="24" rx="7" fill="#1c2230" stroke="#2f3850"/>
  </g>
  <g fill="none" stroke="#8ab4ff" stroke-width="1.6">
    <rect x="974" y="15" width="15" height="10" rx="1.5"/>
    <path d="M978 28h7"/>
    <path d="M981.5 25v3"/>
  </g>
  <text x="998" y="25" class="sans" fill="#c9d4e6" font-size="11.5">Casting · 00:42</text>
  <circle cx="1152" cy="20" r="3" fill="#6ee7a8"/>

  <!-- headline -->
  <g class="sans">
    <text x="64" y="142" fill="#eef3fb" font-size="40" font-weight="600">Use your TV as a</text>
    <text x="64" y="192" fill="#eef3fb" font-size="40" font-weight="600">second monitor.</text>
    <text x="64" y="238" fill="#93a0b8" font-size="17">A real Hyprland headless output, extended onto</text>
    <text x="64" y="262" fill="#93a0b8" font-size="17">your desktop and streamed over the LAN. One-way,</text>
    <text x="64" y="286" fill="#93a0b8" font-size="17">low-latency, fully userspace.</text>
  </g>

  <g class="sans" font-size="15">
    <circle cx="73" cy="340" r="4" fill="#6ee7a8"/>
    <text x="90" y="345" fill="#c3cede">Virtual output · HEADLESS-1 → Sony Bravia</text>
    <circle cx="73" cy="374" r="4" fill="#8ab4ff"/>
    <text x="90" y="379" fill="#c3cede">~2 s glass-to-glass · LL-HLS fMP4</text>
    <circle cx="73" cy="408" r="4" fill="#ffcf6e"/>
    <text x="90" y="413" fill="#c3cede">No root · no systemd · no firewall edits</text>
  </g>

  <rect x="64" y="452" width="286" height="46" rx="10" fill="url(#accent)"/>
  <text x="94" y="480" class="sans" fill="#0d1524" font-size="16" font-weight="600">Use TV as monitor</text>
  <rect x="366" y="452" width="150" height="46" rx="10" fill="#1c2230" stroke="#33405a"/>
  <text x="396" y="480" class="sans" fill="#c9d4e6" font-size="15">Disconnect</text>

  <!-- panel -->
  <g filter="url(#shadow)">
    <rect x="610" y="64" width="532" height="566" rx="16" fill="#1a1e29" stroke="#2b3242"/>
  </g>
  <text x="642" y="108" class="sans" fill="#eef3fb" font-size="21" font-weight="600">Displays &amp; devices</text>
  <text x="642" y="132" class="sans" fill="#7f8ba1" font-size="13">Arrange every display, cast one to the TV</text>
  <circle cx="1100" cy="103" r="14" fill="#232a3a"/>
  <path d="M1095 98a9 9 0 1 0 9 9" fill="none" stroke="#8ab4ff" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M1104 96v7h-7" fill="none" stroke="#8ab4ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- display canvas -->
  <rect x="642" y="152" width="468" height="214" rx="10" fill="#12151d" stroke="#252c3b"/>
  <g class="mono" fill="#55617a" font-size="10">
    <text x="654" y="170">ARRANGE</text>
  </g>

  <!-- physical display -->
  <rect x="686" y="198" width="170" height="104" rx="6" fill="#222938" stroke="#3a4358" stroke-width="1.5"/>
  <rect x="698" y="210" width="146" height="66" rx="3" fill="#2c3446"/>
  <rect x="718" y="282" width="106" height="8" rx="2" fill="#2c3446"/>
  <text x="701" y="196" class="mono" fill="#8b96aa" font-size="10">eDP-1 · 1920×1080</text>

  <!-- virtual display (accent) -->
  <rect x="884" y="198" width="170" height="104" rx="6" fill="#1e2a44" stroke="#5b8cff" stroke-width="2"/>
  <rect x="896" y="210" width="146" height="66" rx="3" fill="#2b3a5e"/>
  <rect x="916" y="282" width="106" height="8" rx="2" fill="#2b3a5e"/>
  <g transform="translate(1032,206)">
    <rect width="16" height="11" rx="1.5" fill="none" stroke="#8ab4ff" stroke-width="1.3"/>
    <path d="M4 15h8M8 11v4" stroke="#8ab4ff" stroke-width="1.3"/>
    <circle cx="17" cy="0" r="3" fill="#6ee7a8"/>
  </g>
  <text x="884" y="196" class="mono" fill="#8ab4ff" font-size="10">HEADLESS-1 · virtual</text>

  <!-- snap indicator -->
  <line x1="856" y1="190" x2="856" y2="310" stroke="#5b8cff" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>

  <text x="642" y="398" class="sans" fill="#eef3fb" font-size="14" font-weight="600">Chromecast devices</text>
  <text x="1010" y="398" class="sans" fill="#7f8ba1" font-size="11">2 found</text>

  <!-- device row 1 -->
  <rect x="642" y="412" width="468" height="62" rx="9" fill="#202838" stroke="#354057"/>
  <circle cx="674" cy="443" r="15" fill="#2a3650"/>
  <rect x="666" y="437" width="16" height="11" rx="1.5" fill="none" stroke="#8ab4ff" stroke-width="1.4"/>
  <path d="M670 451h8M674 448v3" stroke="#8ab4ff" stroke-width="1.4"/>
  <text x="702" y="440" class="sans" fill="#eef3fb" font-size="14" font-weight="600">Sony Bravia X75J</text>
  <text x="702" y="459" class="mono" fill="#7f8ba1" font-size="10.5">192.168.1.42 · Chromecast built-in</text>
  <rect x="1018" y="429" width="76" height="26" rx="13" fill="#1d3a2e" stroke="#2f6b51"/>
  <circle cx="1032" cy="442" r="3" fill="#6ee7a8"/>
  <text x="1043" y="446" class="sans" fill="#8fe6bb" font-size="11">Casting</text>

  <!-- device row 2 -->
  <rect x="642" y="482" width="468" height="62" rx="9" fill="#181d28" stroke="#293142"/>
  <circle cx="674" cy="513" r="15" fill="#232a3a"/>
  <rect x="666" y="507" width="16" height="11" rx="1.5" fill="none" stroke="#8b96aa" stroke-width="1.4"/>
  <path d="M670 521h8M674 518v3" stroke="#8b96aa" stroke-width="1.4"/>
  <text x="702" y="510" class="sans" fill="#c9d4e6" font-size="14" font-weight="600">Panasonic TV</text>
  <text x="702" y="529" class="mono" fill="#7f8ba1" font-size="10.5">192.168.1.57 · Chromecast</text>
  <rect x="1044" y="499" width="50" height="26" rx="13" fill="#232a3a" stroke="#3a4358"/>
  <text x="1058" y="516" class="sans" fill="#a9b6cc" font-size="11">Cast</text>

  <!-- footer -->
  <text x="642" y="580" class="mono" fill="#55617a" font-size="10">Live changes are trials · Keep before the timeout</text>
  <rect x="642" y="592" width="468" height="1" fill="#262e3d"/>
  <circle cx="652" cy="616" r="4" fill="#6ee7a8"/>
  <text x="664" y="620" class="sans" fill="#8b96aa" font-size="11">Session reconciled · no orphaned output</text>
</svg>
