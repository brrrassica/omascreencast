name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python + headless smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Manifest sanity
        run: python3 -c "import json; json.load(open('manifest.json'))"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Headless pipeline smoke
        run: python3 tests/headless_smoke.py
